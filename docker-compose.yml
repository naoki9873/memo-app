version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: memo-db
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: memodb
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    restart: always

  app:
    build: .
    container_name: memo-app
    ports:
      - "8080:8080"
    depends_on:
      - db
    restart: always

volumes:
  db_data:

